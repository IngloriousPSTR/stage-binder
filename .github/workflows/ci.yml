name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Version consistency
        run: npm run version:check

      - name: Typecheck and build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
